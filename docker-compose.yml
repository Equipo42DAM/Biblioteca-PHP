
services:
  web:
    image: php:8.2-apache
    container_name: biblioteca_web
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    command: >
      bash -c "docker-php-ext-install pdo pdo_mysql mysqli && apache2-foreground"
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: biblioteca_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: biblioteca_ohara
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/backup.sql:/docker-entrypoint-initdb.d/backup.sql:ro
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: biblioteca_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
